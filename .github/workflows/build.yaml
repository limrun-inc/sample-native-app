# In your existing workflow
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ios-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Preview
        uses: limrun-inc/ios-preview-action@main
        with:
          api-key: ${{ secrets.LIM_API_KEY }}
          project-path: .
          # The preview simulator attaches to this tunnel before the app
          # launches, so the app reaches the staging API and this laptop.
          tunnel: staging
          env: |
            API_URL=http://api.staging.internal:4200
            ETA_URL=http://localhost:4100
          open-url: limrun-demo://orders/1042
