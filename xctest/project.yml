name: SampleNativeValidation
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  SampleNative:
    type: application
    platform: iOS
    sources: [../sample-native-app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limrun.sample-native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  SampleNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SampleNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limrun.sample-native.uitests
        TEST_TARGET_NAME: SampleNative
schemes:
  SampleNativeValidation:
    build:
      targets:
        SampleNative: all
        SampleNativeUITests: [test]
    test:
      targets: [SampleNativeUITests]
      commandLineArguments:
        "--limrun-runner": true
        "value with spaces": true
      environmentVariables:
        LIMRUN_RUNNER_VALUE: value with spaces
